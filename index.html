<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yForge: forging delightful software</title>
<meta name="description" content="yForge is a software engineering consultancy in Portland, Oregon.">
<meta name="theme-color" content="#120c0b">
<meta property="og:type" content="website">
<meta property="og:title" content="yForge">
<meta property="og:description" content="Forging delightful software in Portland, Oregon.">
<meta property="og:url" content="https://yforge.io/">
<link rel="canonical" href="https://yforge.io/">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --coal: #120c0b;
    --ink: #f3e9e3;
    --muted: #b7a39b;
    --rule: #362724;
    --ember: #ff8a4c;
    --gold: #ffd9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: clamp(1.25rem, 4vw, 3rem);
    background: var(--coal);
    color: var(--ink);
    font: 1.125rem/1.6 "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header, main, footer { width: 100%; max-width: 70rem; margin-inline: auto; }
  h1, header { font-family: Rockwell, "Rockwell Nova", "Roboto Slab", Sitka, Georgia, serif; font-weight: 700; }
  header { font-size: 1.375rem; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-block: 2.5rem; }
  h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(2.75rem, 7.5vw, 5.5rem);
    line-height: 1.06;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  p { margin: 0 0 1.75rem; max-width: 35rem; color: var(--muted); text-wrap: pretty; }
  .cta {
    display: inline-block;
    padding: 0.8rem 1.5rem;
    border-radius: 6px;
    background: var(--gold);
    color: #2a1409;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:hover { background: #ffe7c4; }
  .cta:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.25rem 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.95rem;
  }
  @media (max-width: 46rem) {
    main { padding-block: 1.75rem; }
    h1 { margin-bottom: 1.1rem; }
  }
</style>
</head>
<body>
  <header>yForge</header>
  <main>
    <h1>Forging delightful software.</h1>
    <p>yForge is a software engineering consultancy in Portland, Oregon.</p>
    <a class="cta" href="mailto:hello@yforge.io">Get in touch</a>
  </main>
  <footer>
    <span>© 2026 yForge</span>
    <span>Portland, Oregon</span>
  </footer>
</body>
</html>
